# Phase 1 implementation gate (T5).
#
# Runs the same L0 checks as `scripts/verify.sh --static` on a Linux runner, plus the
# Node unit tests (including the verify.sh self-test regression suite). The macOS-only
# gates — Flutter/Runner builds, RunnerTests, engine smoke, archive check — live in
# ios-compile.yml, which is also triggered on `phase1/**`; they are not duplicated here.
# No secrets, no signing, no real accounts, no device.
name: Phase 1 verify

on:
  push:
    branches: ['phase1/**']
    paths:
      - 'app/**'
      - 'packages/**'
      - 'runtime/**'
      - 'tooling/**'
      - 'docs/specs/phase1/**'
      - 'scripts/verify.sh'
      - 'test/**'
      - '.github/workflows/phase1-verify.yml'
  pull_request:
    branches: ['phase1/**']
    paths:
      - 'app/**'
      - 'packages/**'
      - 'runtime/**'
      - 'tooling/**'
      - 'docs/specs/phase1/**'
      - 'scripts/verify.sh'
      - 'test/**'
      - '.github/workflows/phase1-verify.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: phase1-verify-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: 3.47.7
  # Linux archive SHA256 from releases_linux.json (the dd9da574… pin in the
  # plan/upstream.lock is the macOS arm64 archive used by local builds).
  FLUTTER_SHA256: af7455f540df951184c7953fbe3cf884766e7541dacf8571f9f582db03dd6230
  NODE_VERSION: 24.22.1
  TZ: Asia/Shanghai

jobs:
  static:
    name: L0 static + script self-tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'

      - name: Install Flutter (pinned)
        run: |
          archive="flutter_linux_${FLUTTER_VERSION}-stable.tar.xz"
          curl -fsSL -o "$RUNNER_TEMP/$archive" \
            "https://storage.googleapis.com/flutter_infra_release/releases/stable/linux/$archive"
          echo "$FLUTTER_SHA256  $RUNNER_TEMP/$archive" | sha256sum -c -
          tar -xJf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"

      - name: Resolve dependencies
        run: |
          python3 app/tool/l10n_merge.py --no-gen
          (cd app && flutter pub get --enforce-lockfile)
          for p in packages/*/pubspec.yaml; do
            (cd "$(dirname "$p")" && dart pub get --enforce-lockfile)
          done

      - name: verify.sh --static (fail-on-skip; no silent green)
        run: ./scripts/verify.sh --static

      - name: Node tests + verify.sh self-test
        run: node --test test/unit/*.test.mjs
